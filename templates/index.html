<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音视频下载分析</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>AI智能工具箱</h1>
            <div class="subtitle-nav">
    <a href="/" class="douyin-link" style="border-color:rgba(255,255,255,0.5); box-shadow:0 0 18px rgba(255,107,157,0.25);">抖音小助手</a>
    <span style="color:#555;">·</span>
    <a href="/batch" class="bg-link">批量下载</a>
    <span style="color:#555;">·</span>
    <a href="/convert" class="convert-link">文档转换神器</a>
    <span style="color:#555;">·</span>
    <a href="/bgremove" class="bg-link">一键抠图</a>
</div>
        </header>

        <!-- 输入区 -->
        <section class="input-section">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="粘贴抖音链接: v.douyin.com/xxx 或 douyin.com/video/xxx" autocomplete="off">
                <button id="btnParse" class="btn btn-primary">解析</button>
            </div>
            <div class="quick-actions">
                <button id="btnPaste" class="btn btn-sm">📋 粘贴</button>
                <button id="btnClear" class="btn btn-sm">🗑 清除</button>
                <button id="btnHistory" class="btn btn-sm">📂 历史下载</button>
            </div>
            <div id="parseError" class="error-msg hidden"></div>
        </section>

        <!-- 视频信息卡片（解析后显示） -->
        <section id="videoCard" class="card hidden">
            <div class="card-header">
                <div class="video-cover" id="videoCover"></div>
                <div class="video-meta">
                    <h3 id="videoDesc">-</h3>
                    <div class="meta-row">
                        <span class="meta-item">👤 <strong id="videoAuthor">-</strong></span>
                        <span class="meta-item">⏱ <strong id="videoDuration">-</strong>秒</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-item">❤️ <strong id="videoDigg">-</strong></span>
                        <span class="meta-item">💬 <strong id="videoComment">-</strong></span>
                        <span class="meta-item">🔄 <strong id="videoShare">-</strong></span>
                    </div>
                    <div id="videoHashtags" class="hashtags"></div>
                </div>
            </div>

            <!-- Feature Tabs -->
            <div class="feature-tabs">
                <button class="ftab-btn active" data-tab="tab-download">📥 视频下载</button>
                <button class="ftab-btn" data-tab="tab-comments">💬 评论分析</button>
                <button class="ftab-btn" data-tab="tab-strategy">🧠 内容策略</button>
            </div>

            <!-- Tab 1: 视频下载 -->
            <div id="tab-download" class="ftab-panel">
                <div id="qualitySection" class="quality-section">
                    <h4>🎬 清晰度选择</h4>
                    <div id="qualityOptions" class="quality-options"></div>
                </div>
                <div class="action-buttons">
                    <button id="btnDownload" class="btn btn-success">📥 下载视频</button>
                </div>
                <!-- 进度区（下载时显示） -->
                <div id="downloadProgress" class="hidden" style="margin-top:12px;">
                    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                    <div class="progress-info" style="margin-top:6px;">
                        <span id="progressPercent">0%</span>
                        <span id="progressMsg">准备中...</span>
                    </div>
                    <div id="progressSteps" class="progress-steps" style="margin-top:6px;"></div>
                </div>
            </div>

            <!-- Tab 2: 评论分析 -->
            <div id="tab-comments" class="ftab-panel hidden">
                <button id="btnFetchComments" class="btn btn-primary">🔍 抓取评论并分析</button>
                <div id="commentLoading" class="hidden" style="padding:16px;display:flex;align-items:center;gap:10px;color:var(--text-dim);">
                    <div class="spinner"></div> 正在抓取评论数据，请稍候...
                </div>
                <div id="commentResult"></div>
            </div>

            <!-- Tab 3: 内容策略分析 -->
            <div id="tab-strategy" class="ftab-panel hidden">
                <button id="btnRunStrategy" class="btn btn-primary">🧠 开始 AI 策略分析</button>
                <div id="strategyLoading" class="hidden" style="padding:16px;display:flex;align-items:center;gap:10px;color:var(--text-dim);">
                    <div class="spinner"></div> AI 正在深度分析中，请稍候...
                </div>
                <div id="strategyContent" class="ai-content markdown-body"></div>
            </div>

        </section>

        <!-- 视频播放区 -->
        <section id="videoSection" class="card hidden">
            <h3>📺 视频预览</h3>
            <video id="videoPlayer" controls style="width:100%; max-height:500px; border-radius:12px; background:#000;"></video>
            <div id="videoInfo" class="video-download-info"></div>
        </section>

        <!-- 历史记录弹窗 -->
        <div id="historyModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-tabs">
                        <button class="tab-btn active" onclick="switchHistoryTab('downloads')">📥 下载记录</button>
                        <button class="tab-btn" onclick="switchHistoryTab('analyses')">🧠 分析报告</button>
                    </div>
                    <button class="btn-close" onclick="closeHistory()">✕</button>
                </div>
                <div id="historyList" class="history-list"></div>
                <div id="analysisDetail" class="analysis-detail hidden">
                    <button class="btn btn-sm" onclick="switchHistoryTab('analyses')" style="margin-bottom:12px;">← 返回列表</button>
                    <div id="analysisDetailContent"></div>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast hidden"></div>
    </div>

    <script src="/static/app.js?v=2"></script>
</body>
</html>
