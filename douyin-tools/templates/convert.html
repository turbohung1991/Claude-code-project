<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档转换神器</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>AI智能工具箱</h1>
            <div class="subtitle-nav">
    <a href="/" class="douyin-link">抖音小助手</a>
    <span style="color:#555;">·</span>
    <a href="/batch" class="bg-link">批量下载</a>
    <span style="color:#555;">·</span>
    <a href="/convert" class="convert-link" style="border-color:rgba(255,255,255,0.5); box-shadow:0 0 18px rgba(78,205,196,0.25);">文档转换神器</a>
    <span style="color:#555;">·</span>
    <a href="/bgremove" class="bg-link">一键抠图</a>
</div>
        </header>

        <!-- Toggle buttons (sticky) -->
        <div class="convert-toggles">
            <a href="#!" class="active" data-panel="panel-pdf-ppt">📄 PDF → PPT</a>
            <a href="#!" data-panel="panel-ppt-images">🎞️ PPT → 图片</a>
            <a href="#!" data-panel="panel-pdf-images">📑 PDF → 图片</a>
            <a href="#!" data-panel="panel-images-pdf">🖼️ 图片 → PDF</a>
        </div>

        <!-- Panel: PDF → PPT -->
        <div class="card convert-panel active" id="panel-pdf-ppt">
            <h3>📄 PDF → PPT</h3>
            <form id="form-pdf-ppt" enctype="multipart/form-data">
                <div class="form-group"><label>上传 PDF</label>
                    <div class="drop-zone">
                        
                        <span class="drop-text">拖拽 PDF 到此处，或点击上传</span>
                        <span class="drop-hint">点击上传或拖拽文件到此处</span>
                        <input type="file" name="file" accept=".pdf">
                    </div>
                </div>
                <div class="form-group"><label>清晰度 (DPI)</label><input type="range" name="dpi" min="72" max="300" value="200" step="10" oninput="this.nextElementSibling.textContent=this.value" style="width:100%"><span>200</span></div>
                <button type="submit" class="btn btn-primary">转换为 PPTX</button>
            </form>
            <div class="result-box hidden" id="result-1"></div>
        </div>

        <!-- Panel: PPT → 图片 -->
        <div class="card convert-panel" id="panel-ppt-images">
            <h3>🎞️ PPT → 图片</h3>
            <form id="form-ppt-images" enctype="multipart/form-data">
                <div class="form-group"><label>上传 PPTX</label>
                    <div class="drop-zone">
                        
                        <span class="drop-text">拖拽 PPTX 到此处，或点击上传</span>
                        <span class="drop-hint">点击上传或拖拽文件到此处</span>
                        <input type="file" name="file" accept=".pptx">
                    </div>
                </div>
                <div class="form-group"><label>清晰度 (DPI)</label><input type="range" name="dpi" min="72" max="300" value="200" step="10" oninput="this.nextElementSibling.textContent=this.value" style="width:100%"><span>200</span></div>
                <button type="submit" class="btn btn-primary">转换为图片 ZIP</button>
            </form>
            <div class="result-box hidden" id="result-2"></div>
        </div>

        <!-- Panel: PDF → 图片 -->
        <div class="card convert-panel" id="panel-pdf-images">
            <h3>📑 PDF → 图片</h3>
            <form id="form-pdf-images" enctype="multipart/form-data">
                <div class="form-group"><label>上传 PDF</label>
                    <div class="drop-zone">
                        
                        <span class="drop-text">拖拽 PDF 到此处，或点击上传</span>
                        <span class="drop-hint">点击上传或拖拽文件到此处</span>
                        <input type="file" name="file" accept=".pdf">
                    </div>
                </div>
                <div class="form-group"><label>清晰度 (DPI)</label><input type="range" name="dpi" min="72" max="300" value="200" step="10" oninput="this.nextElementSibling.textContent=this.value" style="width:100%"><span>200</span></div>
                <div class="form-group"><label>格式</label><select name="format"><option value="PNG">PNG</option><option value="JPEG">JPEG</option></select></div>
                <button type="submit" class="btn btn-primary">转换为图片 ZIP</button>
            </form>
            <div class="result-box hidden" id="result-3"></div>
        </div>

        <!-- Panel: 图片 → PDF -->
        <div class="card convert-panel" id="panel-images-pdf">
            <h3>🖼️ 图片 → PDF</h3>
            <form id="form-images-pdf" enctype="multipart/form-data">
                <div class="form-group"><label>上传多张图片</label>
                    <div class="drop-zone">
                        
                        <span class="drop-text">拖拽图片到此处，或点击上传（可多选）</span>
                        <span class="drop-hint">点击上传或拖拽文件到此处</span>
                        <input type="file" name="files" accept="image/*" multiple>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">合并为 PDF</button>
            </form>
            <div class="result-box hidden" id="result-4"></div>
        </div>
    </div>

    <script>
    // Panel toggle
    document.querySelectorAll(".convert-toggles a").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
            document.querySelectorAll(".convert-toggles a").forEach(l => l.classList.remove("active"));
            link.classList.add("active");
            document.querySelectorAll(".convert-panel").forEach(p => p.classList.remove("active"));
            document.getElementById(link.dataset.panel).classList.add("active");
        });
    });

    // Drop zone drag-and-drop with thumbnail preview
    function ensurePreview(zone) {
        let pv = zone.querySelector('.drop-preview');
        if (!pv) {
            pv = document.createElement('div');
            pv.className = 'drop-preview hidden';
            zone.insertBefore(pv, zone.querySelector('input'));
        }
        return pv;
    }
    function showDefault(zone, dropText, dropHint, defaultText) {
        zone.classList.remove('has-file');
        if (dropText) { dropText.style.display = ''; dropText.textContent = defaultText; }
        if (dropHint) dropHint.style.display = '';
        const pv = zone.querySelector('.drop-preview');
        if (pv) { pv.classList.add('hidden'); pv.innerHTML = ''; }
    }
    function showPreview(zone, dropText, dropHint, files) {
        zone.classList.add('has-file');
        if (dropText) dropText.style.display = 'none';
        if (dropHint) dropHint.style.display = 'none';
        const pv = ensurePreview(zone);
        pv.classList.remove('hidden');
        pv.innerHTML = '';
        const names = Array.from(files).map(f => f.name);
        const first = files[0];
        const isImage = first.type.startsWith('image/');
        const ext = (first.name.split('.').pop() || '').toLowerCase();
        if (isImage) {
            const reader = new FileReader();
            reader.onload = () => {
                pv.innerHTML = `<img src="${reader.result}" alt="preview">`;
                pv.innerHTML += `<span class="file-name">${names.join(', ')}</span>`;
            };
            reader.readAsDataURL(first);
        } else if (ext === 'pdf') {
            pv.innerHTML = '<span style="color:#888;font-size:0.85rem;">生成预览中...</span>';
            const fd = new FormData();
            fd.append('file', first);
            fetch('/api/thumbnail/pdf', { method: 'POST', body: fd })
                .then(r => r.ok ? r.blob() : Promise.reject(r))
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    pv.innerHTML = `<img src="${url}" alt="preview">`;
                    pv.innerHTML += `<span class="file-name">${names.join(', ')}</span>`;
                })
                .catch(() => {
                    pv.innerHTML = `<span class="file-icon">📄</span>`;
                    pv.innerHTML += `<span class="file-name">${names.join(', ')}</span>`;
                });
        } else {
            const icons = { pptx: '📊', ppt: '📊', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊' };
            const icon = icons[ext] || '📁';
            pv.innerHTML = `<span class="file-icon">${icon}</span>`;
            pv.innerHTML += `<span class="file-name">${names.join(', ')}</span>`;
        }
    }
    document.querySelectorAll(".drop-zone").forEach(zone => {
        const input = zone.querySelector("input[type=file]");
        const dropText = zone.querySelector(".drop-text");
        const dropHint = zone.querySelector(".drop-hint");
        const defaultText = dropText ? dropText.textContent : '';
        ["dragenter","dragover","dragleave","drop"].forEach(evt => {
            zone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
        });
        ["dragenter","dragover"].forEach(evt => {
            zone.addEventListener(evt, () => zone.classList.add("drag-over"));
        });
        ["dragleave","drop"].forEach(evt => {
            zone.addEventListener(evt, () => zone.classList.remove("drag-over"));
        });
        zone.addEventListener("drop", e => {
            input.files = e.dataTransfer.files;
            input.dispatchEvent(new Event("change"));
        });
        input.addEventListener("change", () => {
            if (input.files.length > 0) {
                showPreview(zone, dropText, dropHint, input.files);
            } else {
                showDefault(zone, dropText, dropHint, defaultText);
            }
        });
    });

    // Form handlers
    function bindForm(id, url) {
        const form = document.getElementById(id);
        const key = id.replace("form-", "");
        const result = document.getElementById("result-" + ({"pdf-ppt":"1","ppt-images":"2","pdf-images":"3","images-pdf":"4"}[key]));
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            result.classList.remove("hidden");
            result.innerHTML = '<span style="color:#888;">处理中...</span>';
            try {
                const resp = await fetch(url, { method: "POST", body: fd });
                if (!resp.ok) { const err = await resp.json(); throw new Error(err.error); }
                const blob = await resp.blob();
                const downloadUrl = URL.createObjectURL(blob);
                const disp = resp.headers.get("Content-Disposition") || "";
                const name = disp.match(/filename="?(.+?)"?$/)?.[1] || "download";
                result.innerHTML = `<a href="${downloadUrl}" download="${name}" class="btn btn-success">下载 ${name}</a>`;
            } catch (err) {
                result.innerHTML = `<span style="color:#ff6b6b;">${err.message}</span>`;
            }
        });
    }
    bindForm("form-pdf-ppt", "/api/convert/pdf-to-ppt");
    bindForm("form-ppt-images", "/api/convert/ppt-to-images");
    bindForm("form-pdf-images", "/api/convert/pdf-to-images");
    bindForm("form-images-pdf", "/api/convert/images-to-pdf");
    </script>
</body>
</html>
